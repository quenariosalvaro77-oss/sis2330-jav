name: persistencia-hs
version: 0.1.0.0
dependencies:
- base >= 4.14 && < 5

library:
  source-dirs: src
  dependencies:
    - directory
  exposed-modules:
    - Modelo
    - Persistencia

executables:
  persistencia-hs-exe:
    main: Main.hs
    source-dirs: app
    dependencies:
    - persistencia-hs

tests:
  persistencia-hs-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
    - persistencia-hs
